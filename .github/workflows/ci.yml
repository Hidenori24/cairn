# CI（SPEC 12.6）
# - Linux: core と cli を GCC・Clang で -Werror、ASan + UBSan で ctest。UI はヘッドレスの煙テスト
# - Windows: MSVC（/MT・/W4 /WX）で exe とテスト。ポータブル版のフォルダ（exe・data\projects・samples）と、インストーラ（Inno Setup。無人でインストール・アンインストールまで確かめる）をアーティファクトに
# - タグ v*: ポータブル版の zip・インストーラ・チェックサムをリリースに添付（配布物の名前は Cairn-windows-x64.zip・Cairn-Setup-<版>.exe・SHA256SUMS.txt。Issue #82）
#   タグに「-」を含む（1.0.0-rc.1 など）ときは pre-release にして「最新」にしない
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "付けるタグ（例: v0.2.0）。空ならビルドとテストだけ"
        required: false
        default: ""
      target:
        description: "タグを付けるコミット（空なら実行したブランチの先頭）"
        required: false
        default: ""
      artifact_run:
        description: "exe を取る CI の実行の ID（空ならこの実行で作ったもの。過去のコミットに付けるとき）"
        required: false
        default: ""
      keep_notes:
        description: "true ならリリースの説明文には触らず、zip とチェックサムだけを既存のリリースに追加する"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake --preset linux-asan
      - name: build
        run: cmake --build --preset linux-asan
      - name: test
        run: ctest --preset linux-asan

  linux-ui:
    name: linux (UI の煙テスト)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: cmake --preset linux-ui -DROADMAP_SANITIZE=ON -DROADMAP_BUILD_TESTS=OFF
      - name: build
        run: cmake --build --preset linux-ui
      - name: test
        run: ctest --preset linux-ui

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: configure
        run: cmake --preset linux-release
      - name: clang-tidy（core・cli・controller）
        run: |
          clang-tidy -p build/linux-release --quiet core/src/*.cpp cli/main.cpp app/controller/app_controller.cpp \
            --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle,bugprone-undefined-memory-manipulation'

  windows:
    name: windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: configure
        run: cmake --preset windows-release -DROADMAP_UI_TESTS=ON
      - name: build
        run: cmake --build --preset windows-release
      - name: test
        run: ctest --preset windows-release
      - name: size check（10MB 以下）
        shell: pwsh
        run: |
          $exe = Get-Item build/windows-release/app/Cairn.exe
          "{0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -gt 10MB) { throw "exe が 10MB を超えています" }
      - name: ポータブル版のフォルダ（exe・data\projects・samples・README）
        run: cmake --install build/windows-release --component portable --prefix dist/Cairn
      - name: インストーラ（Inno Setup）
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(ProjectRoadmap VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          "Inno Setup: $iscc / version $ver"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\Cairn" "/DRepoDir=$PWD" "/DOutDir=$PWD\dist" packaging\installer\Cairn.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }
          Get-ChildItem dist | Format-Table Name, Length
      - name: インストーラの確認（無人でインストール → 動く → アンインストールしてもデータは残る）
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(ProjectRoadmap VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $setup = Join-Path $PWD "dist\Cairn-Setup-$ver.exe"
          $dir = Join-Path $env:RUNNER_TEMP "inst"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$log" -Wait
          foreach ($f in "Cairn.exe","rmcli.exe","README.txt","THIRD_PARTY.md","samples\hierarchy_demo.csv","data\projects\README.txt","unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-Content $log -Tail 40; throw "インストール先に $f がありません" }
          }
          & (Join-Path $dir "rmcli.exe") validate (Join-Path $dir "samples\hierarchy_demo.csv")
          if ($LASTEXITCODE -ne 0) { throw "インストールした rmcli が動きません" }
          # 利用者のデータ（上書きインストールとアンインストールで残ること）
          Set-Content -Path (Join-Path $dir "data\projects\mine.csv") -Value "keep"
          Set-Content -Path (Join-Path $dir "roadmap_prefs.json") -Value "{}"
          # 旧名（Project Roadmap）の版からの更新: 古い exe と古い名前のショートカットが残らないこと（Issue #82）
          $oldExe = Join-Path $dir "ProjectRoadmap.exe"
          $oldLnk = @((Join-Path ([Environment]::GetFolderPath("Programs")) "Project Roadmap.lnk"),
                      (Join-Path ([Environment]::GetFolderPath("DesktopDirectory")) "Project Roadmap.lnk"))
          Set-Content -Path $oldExe -Value "old"
          foreach ($l in $oldLnk) { New-Item -ItemType Directory -Force (Split-Path $l) | Out-Null; Set-Content -Path $l -Value "old" }
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "data\projects\mine.csv"))) { throw "上書きインストールでデータが消えました" }
          if (-not (Test-Path (Join-Path $dir "roadmap_prefs.json"))) { throw "上書きインストールで設定が消えました" }
          if (Test-Path $oldExe) { throw "上書きインストールで古い名前の exe が消えません" }
          foreach ($l in $oldLnk) { if (Test-Path $l) { throw "古い名前のショートカットが残っています: $l" } }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "Cairn.lnk"))) { throw "スタートメニューに Cairn のショートカットがありません" }
          if (-not (Test-Path (Join-Path $dir "Cairn.exe"))) { throw "上書きインストールで Cairn.exe がありません" }
          # アンインストーラは自分のコピーを動かして先に終わるので、消えるまで待つ
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "Cairn.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "Cairn.exe")) { throw "アンインストールで exe が消えません" }
          if (-not (Test-Path (Join-Path $dir "data\projects\mine.csv"))) { throw "アンインストールでデータが消えました" }
          if (-not (Test-Path (Join-Path $dir "roadmap_prefs.json"))) { throw "アンインストールで設定が消えました" }
          "OK: インストール・上書き・アンインストール"
      - name: リリース配布物の名前の確認（dry run。タグを付ける前に、zip・インストーラ・チェックサムが同じ名前で揃うこと）
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(ProjectRoadmap VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $rel = Join-Path $env:RUNNER_TEMP "release-dry"
          New-Item -ItemType Directory -Force $rel | Out-Null
          Compress-Archive -Path dist\Cairn -DestinationPath (Join-Path $rel "Cairn-windows-x64.zip")
          Copy-Item "dist\Cairn-Setup-$ver.exe" $rel
          $sums = Get-ChildItem $rel -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          Set-Content -Path (Join-Path $rel "SHA256SUMS.txt") -Value $sums
          Get-ChildItem $rel | Format-Table Name, Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $rel "Cairn-windows-x64.zip"))
          $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' }
          $zip.Dispose()
          foreach ($n in "Cairn/Cairn.exe","Cairn/rmcli.exe","Cairn/README.txt","Cairn/data/projects/README.txt") {
            if ($names -notcontains $n) { throw "zip に $n がありません" }
          }
          if ($names -contains "Cairn/ProjectRoadmap.exe") { throw "zip に古い名前の exe があります" }
          foreach ($f in "Cairn-windows-x64.zip","Cairn-Setup-$ver.exe","SHA256SUMS.txt") {
            if (-not (Test-Path (Join-Path $rel $f))) { throw "配布物 $f がありません" }
          }
      - name: リリース配布物にコード署名
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          CAIRN_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CAIRN_SIGNING_CERTIFICATE_BASE64 }}
          CAIRN_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CAIRN_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CAIRN_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:CAIRN_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "署名には Actions secrets CAIRN_SIGNING_CERTIFICATE_BASE64 と CAIRN_SIGNING_CERTIFICATE_PASSWORD が必要です"
          }
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "Windows SDK の signtool.exe が見つかりません" }
          $certPath = Join-Path $env:RUNNER_TEMP "cairn-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CAIRN_SIGNING_CERTIFICATE_BASE64))
          try {
            $files = Get-ChildItem dist -Filter *.exe -File -Recurse
            if (-not $files) { throw "署名対象の exe が dist にありません" }
            foreach ($file in $files) {
              & $signTool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:CAIRN_SIGNING_CERTIFICATE_PASSWORD $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "署名に失敗しました: $($file.Name)" }
              & $signTool verify /pa /v $file.FullName
              if ($LASTEXITCODE -ne 0) { throw "署名の検証に失敗しました: $($file.Name)" }
            }
          } finally {
            Remove-Item $certPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v6
        with:
          name: Cairn-windows
          path: dist/

  # 手動の実行でタグとリリースを作る（このリポジトリへのタグの push ができない環境のため）。
  # GITHUB_TOKEN で作ったタグでは、ほかのワークフローは動かない
  tag-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [linux, linux-ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.release_tag }}
      TARGET: ${{ inputs.target != '' && inputs.target || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/download-artifact@v7
        with:
          name: Cairn-windows
          path: dist
          run-id: ${{ inputs.artifact_run != '' && inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: zip・チェックサム・リリースノート
        run: |
          cd dist
          zip -r -X Cairn-windows-x64.zip Cairn
          sha256sum Cairn-windows-x64.zip Cairn/*.exe Cairn-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ver="${TAG#v}"
          # 「## 1.0.0-rc.1」のような見出しでも、その節だけを取る（tools/release_notes.sh。tests/release_notes_test.sh で確認）
          sh ../tools/release_notes.sh "$ver" ../docs/CHANGELOG.md > notes.md
          printf '\n---\nポータブル版: zip を展開して Cairn.exe を実行（インストール不要）。\n' >> notes.md
          cat notes.md
      - name: 既存のリリースにファイルだけ追加（説明文はそのまま）
        if: inputs.keep_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Cairn-windows-x64.zip dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        if: inputs.keep_notes != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.TARGET }}
          name: ${{ env.TAG }}
          body_path: dist/notes.md
          # タグに「-」を含む（1.0.0-rc.1 など）ときは pre-release にして、「最新」にしない。
          # 過去のコミットに付けるとき（成果物の実行を指定したとき）も「最新」にしない
          prerelease: ${{ contains(env.TAG, '-') }}
          make_latest: ${{ (inputs.artifact_run == '' && !contains(env.TAG, '-')) && 'true' || 'false' }}
          files: |
            dist/Cairn-windows-x64.zip
            dist/Cairn-Setup-*.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Cairn-windows
          path: dist
      - name: zip とチェックサム
        run: |
          cd dist
          zip -r -X Cairn-windows-x64.zip Cairn
          sha256sum Cairn-windows-x64.zip Cairn/*.exe Cairn-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # タグに「-」を含む（v1.0.0-rc.1 など）ときは pre-release にして「最新」にしない
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            dist/Cairn-windows-x64.zip
            dist/Cairn-Setup-*.exe
            dist/SHA256SUMS.txt
