# CI（SPEC 12.6）
# - Linux: core と cli を GCC・Clang で -Werror、ASan + UBSan で ctest。UI はヘッドレスの煙テスト
# - Windows: MSVC（/MT・/W4 /WX）で exe とテスト。ポータブル版のフォルダ（exe・data\projects・samples）と、インストーラ（Inno Setup。無人でインストール・アンインストールまで確かめる）をアーティファクトに
# - タグ v*: ポータブル版の zip・インストーラ・チェックサムをリリースに添付
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "付けるタグ（例: v0.2.0）。空ならビルドとテストだけ"
        required: false
        default: ""
      target:
        description: "タグを付けるコミット（空なら実行したブランチの先頭）"
        required: false
        default: ""
      artifact_run:
        description: "exe を取る CI の実行の ID（空ならこの実行で作ったもの。過去のコミットに付けるとき）"
        required: false
        default: ""
      keep_notes:
        description: "true ならリリースの説明文には触らず、zip とチェックサムだけを既存のリリースに追加する"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake --preset linux-asan
      - name: build
        run: cmake --build --preset linux-asan
      - name: test
        run: ctest --preset linux-asan

  linux-ui:
    name: linux (UI の煙テスト)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: cmake --preset linux-ui -DROADMAP_SANITIZE=ON -DROADMAP_BUILD_TESTS=OFF
      - name: build
        run: cmake --build --preset linux-ui
      - name: test
        run: ctest --preset linux-ui

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: configure
        run: cmake --preset linux-release
      - name: clang-tidy（core・cli・controller）
        run: |
          clang-tidy -p build/linux-release --quiet core/src/*.cpp cli/main.cpp app/controller/app_controller.cpp \
            --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle,bugprone-undefined-memory-manipulation'

  windows:
    name: windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: configure
        run: cmake --preset windows-release -DROADMAP_UI_TESTS=ON
      - name: build
        run: cmake --build --preset windows-release
      - name: test
        run: ctest --preset windows-release
      - name: size check（10MB 以下）
        shell: pwsh
        run: |
          $exe = Get-Item build/windows-release/app/ProjectRoadmap.exe
          "{0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -gt 10MB) { throw "exe が 10MB を超えています" }
      - name: ポータブル版のフォルダ（exe・data\projects・samples・README）
        run: cmake --install build/windows-release --component portable --prefix dist/ProjectRoadmap
      - name: インストーラ（Inno Setup）
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(ProjectRoadmap VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          "Inno Setup: $iscc / version $ver"
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$PWD\dist\ProjectRoadmap" "/DRepoDir=$PWD" "/DOutDir=$PWD\dist" packaging\installer\ProjectRoadmap.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました" }
          Get-ChildItem dist | Format-Table Name, Length
      - name: インストーラの確認（無人でインストール → 動く → アンインストールしてもデータは残る）
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(ProjectRoadmap VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          $setup = Join-Path $PWD "dist\ProjectRoadmap-Setup-$ver.exe"
          $dir = Join-Path $env:RUNNER_TEMP "inst"
          $log = Join-Path $env:RUNNER_TEMP "setup.log"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir","/LOG=$log" -Wait
          foreach ($f in "ProjectRoadmap.exe","rmcli.exe","README.txt","THIRD_PARTY.md","samples\hierarchy_demo.csv","data\projects\README.txt","unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-Content $log -Tail 40; throw "インストール先に $f がありません" }
          }
          & (Join-Path $dir "rmcli.exe") validate (Join-Path $dir "samples\hierarchy_demo.csv")
          if ($LASTEXITCODE -ne 0) { throw "インストールした rmcli が動きません" }
          # 利用者のデータ（上書きインストールとアンインストールで残ること）
          Set-Content -Path (Join-Path $dir "data\projects\mine.csv") -Value "keep"
          Set-Content -Path (Join-Path $dir "roadmap_prefs.json") -Value "{}"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait
          if (-not (Test-Path (Join-Path $dir "data\projects\mine.csv"))) { throw "上書きインストールでデータが消えました" }
          # アンインストーラは自分のコピーを動かして先に終わるので、消えるまで待つ
          Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "ProjectRoadmap.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "ProjectRoadmap.exe")) { throw "アンインストールで exe が消えません" }
          if (-not (Test-Path (Join-Path $dir "data\projects\mine.csv"))) { throw "アンインストールでデータが消えました" }
          if (-not (Test-Path (Join-Path $dir "roadmap_prefs.json"))) { throw "アンインストールで設定が消えました" }
          "OK: インストール・上書き・アンインストール"
      - uses: actions/upload-artifact@v6
        with:
          name: ProjectRoadmap-windows
          path: dist/

  # 手動の実行でタグとリリースを作る（このリポジトリへのタグの push ができない環境のため）。
  # GITHUB_TOKEN で作ったタグでは、ほかのワークフローは動かない
  tag-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [linux, linux-ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.release_tag }}
      TARGET: ${{ inputs.target != '' && inputs.target || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/download-artifact@v7
        with:
          name: ProjectRoadmap-windows
          path: dist
          run-id: ${{ inputs.artifact_run != '' && inputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: zip・チェックサム・リリースノート
        run: |
          cd dist
          # 0.1.0 の成果物は exe だけ（フォルダの形は 0.2.0 から）
          if [ ! -d ProjectRoadmap ]; then mkdir ProjectRoadmap && find . -path ./ProjectRoadmap -prune -o -name '*.exe' -exec mv {} ProjectRoadmap/ \; ; fi
          zip -r -X ProjectRoadmap-windows-x64.zip ProjectRoadmap
          # インストーラは 0.3.0 から（それ以前の成果物にはない）
          sha256sum ProjectRoadmap-windows-x64.zip ProjectRoadmap/*.exe $(ls ProjectRoadmap-Setup-*.exe 2>/dev/null || true) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ver="${TAG#v}"
          awk -v v="## ${ver}" 'index($0, "## ") == 1 { p = (index($0, v) == 1) } p' ../docs/CHANGELOG.md > notes.md
          printf '\n---\nポータブル版: zip を展開して ProjectRoadmap.exe を実行（インストール不要）。\n' >> notes.md
          cat notes.md
      - name: 既存のリリースにファイルだけ追加（説明文はそのまま）
        if: inputs.keep_notes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/ProjectRoadmap-windows-x64.zip dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        if: inputs.keep_notes != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.TARGET }}
          name: ${{ env.TAG }}
          body_path: dist/notes.md
          # 過去のコミットに付けるとき（成果物の実行を指定したとき）は「最新」にしない
          make_latest: ${{ inputs.artifact_run == '' && 'true' || 'false' }}
          files: |
            dist/ProjectRoadmap-windows-x64.zip
            dist/ProjectRoadmap-Setup-*.exe
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ProjectRoadmap-windows
          path: dist
      - name: zip とチェックサム
        run: |
          cd dist
          zip -r -X ProjectRoadmap-windows-x64.zip ProjectRoadmap
          sha256sum ProjectRoadmap-windows-x64.zip ProjectRoadmap/*.exe ProjectRoadmap-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ProjectRoadmap-windows-x64.zip
            dist/ProjectRoadmap-Setup-*.exe
            dist/SHA256SUMS.txt
