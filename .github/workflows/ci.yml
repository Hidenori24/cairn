# CI（SPEC 12.6）
# - Linux: core と cli を GCC・Clang で -Werror、ASan + UBSan で ctest。UI はヘッドレスの煙テスト
# - Windows: MSVC（/MT・/W4 /WX）で exe とテスト。exe をアーティファクトに
# - タグ v*: exe とチェックサムをリリースに添付
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake --preset linux-asan
      - name: build
        run: cmake --build --preset linux-asan
      - name: test
        run: ctest --preset linux-asan
      - name: golden の再現性（JS版のライブラリで作り直しても一致する）
        if: matrix.compiler == 'gcc'
        run: node tools/golden/gen_golden.js --check

  linux-ui:
    name: linux (UI の煙テスト)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: configure
        run: cmake --preset linux-ui -DROADMAP_SANITIZE=ON -DROADMAP_BUILD_TESTS=OFF
      - name: build
        run: cmake --build --preset linux-ui
      - name: test
        run: ctest --preset linux-ui

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: configure
        run: cmake --preset linux-release
      - name: clang-tidy（core・cli・controller）
        run: |
          clang-tidy -p build/linux-release --quiet core/src/*.cpp cli/main.cpp app/controller/app_controller.cpp \
            --warnings-as-errors='bugprone-use-after-move,bugprone-dangling-handle,bugprone-undefined-memory-manipulation'

  windows:
    name: windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: configure
        run: cmake --preset windows-release -DROADMAP_UI_TESTS=ON
      - name: build
        run: cmake --build --preset windows-release
      - name: test
        run: ctest --preset windows-release
      - name: size check（10MB 以下）
        shell: pwsh
        run: |
          $exe = Get-Item build/windows-release/app/ProjectRoadmap.exe
          "{0:N1} MB" -f ($exe.Length / 1MB)
          if ($exe.Length -gt 10MB) { throw "exe が 10MB を超えています" }
      - uses: actions/upload-artifact@v6
        with:
          name: ProjectRoadmap-windows
          path: |
            build/windows-release/app/ProjectRoadmap.exe
            build/windows-release/cli/rmcli.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-ui, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ProjectRoadmap-windows
          path: dist
      - name: checksums
        run: cd dist && find . -name '*.exe' -exec sha256sum {} \; > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/SHA256SUMS.txt
